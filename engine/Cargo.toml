[package]
name = "chinescan-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[workspace]
members = ["crates/common", "crates/reporter", "crates/scoring", "crates/alerts"]
resolver = "2"

[lib]
name = "chinescan_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
flate2 = "=1.1.5"
pyo3 = { version = "0.29", default-features = false, features = ["abi3-py312", "macros"] }
tar = "=0.4.46"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
chinescan-reporter = { path = "crates/reporter" }
ed25519-dalek = "=2.2.0"
chinescan-scoring = { path = "crates/scoring" }
chinescan-alerts = { path = "crates/alerts" }

[dependencies.regex]
version = "=1.11.3"
default-features = false
features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat"]

[dev-dependencies]
proptest = "=1.9.0"

