[package]
name = "chinescan-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[lib]
name = "chinescan_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
flate2 = "=1.1.5"
pyo3 = { version = "0.29", default-features = false, features = ["abi3-py312", "macros"] }
tar = "=0.4.46"

[dependencies.regex]
version = "=1.11.3"
default-features = false
features = ["std", "perf", "unicode-perl", "unicode-case", "unicode-gencat"]

[dev-dependencies]
proptest = "=1.9.0"

