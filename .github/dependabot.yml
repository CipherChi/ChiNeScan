version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: mypy
        update-types:
          - "version-update:semver-major"
      - dependency-name: pytest-cov
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
